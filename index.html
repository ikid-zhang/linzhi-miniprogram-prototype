<style>
:root{
  --bg:#EFF2F7; --panel:#FFFFFF; --line:#E2E8F0; --ink:#0F172A; --sub:#64748B;
  --blue:#0B3C8C; --blue2:#1668DC; --blue-soft:#EAF1FB;
  --green:#0E9F6E; --orange:#D97706; --red:#DC2626; --gray:#94A3B8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow-x:hidden}
/* ===== 顶部 ===== */
.topbar{height:62px;background:linear-gradient(120deg,#0B3C8C 0%,#14489F 55%,#1D5BBF 100%);color:#fff;display:flex;align-items:center;padding:0 22px;box-shadow:0 1px 2px rgba(11,60,140,.16),0 10px 24px -10px rgba(11,60,140,.26),0 30px 60px -24px rgba(11,60,140,.22);position:relative;z-index:5}
.topbar .badge{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-right:13px}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.topbar .sub{font-size:12px;opacity:.82;margin-top:2px;font-weight:400;letter-spacing:.4px}
.tb-right{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:18px;font-size:13px}
.tb-right .dot{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.25);margin-right:6px;display:inline-block}
.topbar .net-tag{font-size:12px;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
/* ===== 布局 ===== */
.layout{display:flex;height:calc(100vh - 62px)}
/* 左栏 */
.side{width:196px;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;flex-shrink:0}
.side .side-title{font-size:12px;color:var(--sub);padding:4px 10px 10px;font-weight:600;letter-spacing:1px}
.biz-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:13.5px;margin-bottom:3px;transition:.15s;position:relative}
.biz-item:hover{background:#F1F5F9}
.biz-item.active{background:var(--blue-soft);color:var(--blue2);font-weight:600}
.biz-item .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.biz-item .cnt{margin-left:auto;font-size:11.5px;color:var(--sub);background:#F1F5F9;border-radius:999px;padding:2px 8px;font-weight:500}
.biz-item.active .cnt{background:#fff;color:var(--blue2)}
.side .sec-line{margin:10px 8px;border-top:1px dashed var(--line)}
.side .note{font-size:11px;color:var(--gray);padding:4px 10px;line-height:1.6}
/* 中栏 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.list-head{background:var(--panel);padding:16px 22px 12px;border-bottom:1px solid var(--line)}
.list-head .row1{display:flex;align-items:center;gap:12px}
.list-head .crumb{font-size:18px;font-weight:700}
.list-head .crumb small{font-size:12px;color:var(--sub);font-weight:500;margin-left:8px}
.list-head .search{margin-left:auto;display:flex;align-items:center;gap:10px}
.search input{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;width:230px;outline:none}
.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(22,104,220,.12)}
.biz-tabs{display:flex;align-items:center;gap:3px;margin-top:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.biz-tab{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--ink);cursor:pointer;transition:.12s;user-select:none;white-space:nowrap;flex-shrink:0}
.biz-tab:hover{border-color:var(--blue2);background:#F8FAFF}
.biz-tab.active{border-color:var(--blue2);background:var(--blue2);color:#fff;font-weight:600}
.biz-tab .dot{width:7px;height:7px;border-radius:2.5px;flex-shrink:0}
.biz-tab.active .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.biz-tab .cnt{font-size:10px;background:#F1F5F9;border-radius:999px;padding:0 5px;color:var(--sub);line-height:15px;margin-left:1px}
.biz-tab.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.stat-chips{display:flex;gap:8px;margin-top:12px}
.chip{padding:5px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;cursor:pointer;color:var(--sub);background:#fff}
.chip.active{background:var(--blue2);border-color:var(--blue2);color:#fff;font-weight:600}
.table-wrap{flex:1;overflow:auto;background:var(--panel);margin:0}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:740px}
thead th{position:sticky;top:0;background:#F8FAFC;font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:#F4F8FF}
tbody tr.sel{background:var(--blue-soft)}
/* 操作列吸附右侧：任何宽度下"查看材料"按钮保持可见 */
thead th:last-child{position:sticky;right:0;background:#F8FAFC;z-index:3;box-shadow:-6px 0 8px rgba(15,23,42,.04)}
tbody td:last-child{position:sticky;right:0;background:var(--panel);z-index:1;box-shadow:-6px 0 8px rgba(15,23,42,.05);width:96px;max-width:96px}
tbody tr:hover td:last-child{background:#F4F8FF}
tbody tr.sel td:last-child{background:var(--blue-soft)}
.td-hlw{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;color:var(--sub);word-break:break-all;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.badge .bd-dot{width:6px;height:6px;border-radius:50%}
.b-st0{color:#2547A8;background:#EFF6FF}.b-st0 .bd-dot{background:#3B6FD9}
.b-st1{color:#B45309;background:#FFFBEB}.b-st1 .bd-dot{background:#D97706}
.b-st2{color:#047857;background:#ECFDF5}.b-st2 .bd-dot{background:#059669}
.b-st3{color:#B91C1C;background:#FEF2F2}.b-st3 .bd-dot{background:#C53030}
.td-mats{display:flex;gap:4px;flex-wrap:wrap}
.m-chip{font-size:11px;color:var(--blue2);background:var(--blue-soft);border-radius:5px;padding:2px 7px}
.m-chip.opt{color:var(--sub);background:#F1F5F9}
.act-btn{font-size:12px;color:#fff;background:var(--blue2);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.act-btn:hover{background:#1453B5}
@media (max-width:1100px){.act-btn{padding:6px 9px;font-size:11.5px}}
.empty{display:none;text-align:center;color:var(--gray);padding:70px 0;font-size:13px}
/* 右栏 */
.right{width:392px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.right-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.right-head .t{font-size:14px;font-weight:700}
.right-head .s{font-size:12px;color:var(--sub);margin-top:3px}
.right-body{flex:1;overflow:auto;padding:14px 18px}
.rec-card{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12.5px}
.rec-card .kv{display:flex;margin-bottom:5px}
.rec-card .kv .k{color:var(--sub);width:76px;flex-shrink:0}
.mats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.mat-card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.mat-card:hover{border-color:var(--blue2);box-shadow:0 1px 2px rgba(11,60,140,.08),0 6px 16px -4px rgba(11,60,140,.12),0 18px 36px -12px rgba(11,60,140,.14)}
.mat-card .thumb{background:#F1F5F9;display:flex;align-items:center;justify-content:center;height:92px;position:relative}
.mat-card .thumb canvas{max-width:100%;max-height:88px;border-radius:4px}
.mat-card .f-type{position:absolute;left:6px;top:6px;font-size:10px;color:#fff;border-radius:4px;padding:2px 6px;font-weight:600}
.mat-card .meta{padding:8px 10px}
.mat-card .meta .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat-card .meta .d{font-size:11px;color:var(--sub);margin-top:3px;display:flex;justify-content:space-between}
.right-empty{display:none;text-align:center;color:var(--gray);padding:60px 18px;font-size:12.5px;line-height:1.8}
.right-empty .big{font-size:15px;color:#CBD5E1;margin-bottom:8px}
/* 模态 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;opacity:0;transition:opacity .2s}
.mask.show{display:flex;opacity:1}
.mask .modal{transform:translateY(12px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.mask.show .modal{transform:none}
.modal{background:#fff;border-radius:20px;width:720px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.10),0 22px 48px -14px rgba(11,60,140,.22),0 56px 100px -32px rgba(11,60,140,.30)}
.modal-head{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:#F8FAFC}
.modal-head .t{font-size:15px;font-weight:700}
.modal-head .s{font-size:12px;color:var(--sub);margin-left:10px}
.modal-head .close{margin-left:auto;width:30px;height:30px;border:none;background:#F1F5F9;border-radius:8px;cursor:pointer;font-size:16px;color:var(--sub)}
.modal-body{flex:1;overflow:auto;padding:18px 20px;background:#F1F4F8;display:flex;align-items:center;justify-content:center;min-height:420px}
.modal-body canvas{max-width:100%;box-shadow:0 1px 3px rgba(15,23,42,.10),0 8px 20px -6px rgba(15,23,42,.14),0 24px 48px -16px rgba(15,23,42,.18);border-radius:8px}
.modal-foot{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.modal-foot .f1{font-size:12px;color:var(--sub);flex:1}
.dl-btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue2);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
.dl-btn:hover{background:#1453B5}
.dl-btn svg{width:15px;height:15px}
.dl-all{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue2);border:1px solid rgba(22,104,220,.25);border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.dl-all:hover{background:#DEEAFB}
.pager{display:flex;gap:8px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pg-n{font-size:12.5px;color:var(--sub);display:flex;align-items:center;padding:0 6px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#0F172A;color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:80}
.toast.show{opacity:1}
.wm{position:fixed;right:14px;bottom:12px;font-size:11px;color:rgba(15,23,42,.36);background:rgba(255,255,255,.6);padding:3px 12px;border-radius:999px;z-index:60;pointer-events:none;letter-spacing:.3px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
@media (max-width:1180px){.right{width:340px}.side{width:170px}}
@media (max-width:860px){.layout{flex-direction:column;height:auto;overflow:visible}.side,.right{width:100%;max-width:100%;min-width:0;border:none;border-bottom:1px solid var(--line)}.main{min-width:0}.main{min-height:60vh}.table-wrap{overflow-x:auto}.side{display:flex;flex-wrap:wrap;gap:4px}.side-title{width:100%}.biz-item{width:calc(50% - 4px)}}
.right-body,.rec-card,.mats-grid,.td-mats{max-width:100%}.right,.right-head,.right-body,.td-mats,.kv{overflow-wrap:break-word;min-width:0}.right{overflow-x:hidden}.mats-grid{grid-template-columns:1fr 1fr}
</style>
</head>

<div class="topbar">

    <div class="right-body" id="rightBody"></div>

</div>

<!-- 预览模态 -->
<div class="mask" id="mask">

  </div>
</div>
<div class="toast" id="toast"></div>
<div class="wm">民警 · 户籍窗口 · <span id="wmTime">--</span> · 查看 / 下载操作将记录审计日志</div>
</body>

/* ============ Canvas 证件绘制 ============ */
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function stamp(ctx,cx,cy,rad,text){ // 红章
  ctx.save();ctx.translate(cx,cy);
  ctx.strokeStyle='#C8102E';ctx.fillStyle='#C8102E';
  ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,rad-14,0,Math.PI*2);ctx.lineWidth=1.5;ctx.stroke();
  const chs=text.split('');
  ctx.font='13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<chs.length;i++){
    const a=-Math.PI/2+(i-chs.length/2+0.5)*(Math.PI/(chs.length));
    ctx.save();ctx.rotate(a);ctx.translate(0,-(rad-20));ctx.fillText(chs[i],0,0);ctx.restore();
  }
  // 五角星
  ctx.beginPath();
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;const x=Math.cos(a)*13,y=Math.sin(a)*13;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.closePath();ctx.fillStyle='#C8102E';ctx.fill();
  ctx.restore();
}
function paper(ctx,w,h,accent){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#FFFFFF';roundRect(ctx,0,0,w,h,0);ctx.fill();
  ctx.strokeStyle=accent;ctx.lineWidth=3;roundRect(ctx,8,8,w-16,h-16,4);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;roundRect(ctx,14,14,w-28,h-28,2);ctx.stroke();
}
function rowKV(ctx,y,label,val,x,fontSize){
  ctx.fillStyle='#1E293B';ctx.font=`600 ${fontSize}px sans-serif`;ctx.textAlign='left';ctx.fillText(label,x,y);
  ctx.fillStyle='#0F172A';ctx.font=`500 ${fontSize}px sans-serif`;ctx.fillText(val,x+108,y);
}
function docHeader(ctx,w,title,no,accent){
  ctx.fillStyle=accent;ctx.font='700 26px sans-serif';ctx.textAlign='center';ctx.fillText(title,w/2,52);
  ctx.fillStyle='#64748B';ctx.font='500 13px sans-serif';ctx.fillText(no,w/2,78);
  ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2-150,92);ctx.lineTo(w/2+150,92);ctx.stroke();
}
function bodyText(ctx,text,x,y,w,size){
  ctx.fillStyle='#1E293B';ctx.font='500 '+size+'px sans-serif';ctx.textAlign='left';
  let line='',yy=y;
  for(const ch of text){line+=ch;if(ctx.measureText(line).width>w){ctx.fillText(line,x,yy);yy+=size+9;line=ch}}
  if(line)ctx.fillText(line,x,yy);
  return yy;
}

    stamp(ctx,600,420,52,'波密县人民医院出生医学证明专用章');

    paper(ctx,W,H,'#B45309');
    ctx.fillStyle='#B45309';ctx.font='700 25px sans-serif';ctx.textAlign='center';ctx.fillText(p.title,W/2,52);
    ctx.fillStyle='#64748B';ctx.font='500 13px sans-serif';ctx.fillText('证书编号：'+p.no,W/2,78);

    rowKV(ctx,174,'权利类型',p.type,60,16);
    rowKV(ctx,208,'坐　　落',p.loc,60,16);

    ctx.fillStyle='#94A3B8';ctx.font='400 11px sans-serif';ctx.fillText('登记机构：波密县不动产登记中心（演示）',60,320);
    stamp(ctx,600,400,52,'波密县不动产登记中心');
    return;
  }
  if(p.kind==='cert'){
    paper(ctx,W,H,'#1668DC');
    docHeader(ctx,W,p.title,p.no,'#1668DC');
    bodyText(ctx,p.body,80,150,560,17);
    ctx.fillStyle='#1E293B';ctx.font='500 15px sans-serif';ctx.textAlign='left';
    ctx.fillText('签发单位：'+p.stamp,80,300);
    ctx.fillText('出具日期：'+p.date,80,330);
    ctx.fillStyle='#94A3B8';ctx.font='400 11px sans-serif';ctx.fillText('（电子证照 · 亮码可核验）',80,380);
    stamp(ctx,560,420,56,'波密县公安局户籍业务专用章');
    return;
  }
  if(p.kind==='mzs'||p.kind==='wfz'||p.kind==='doc'||p.kind==='swzm'){
    const col={mzs:'#D97706',wfz:'#7B5BD6',doc:'#475569',swzm:'#475569'}[p.kind];
    paper(ctx,W,H,col);
    docHeader(ctx,W,p.title,p.no||'',col);
    let y=140;
    if(p.kind==='mzs'){

      rowKV(ctx,y,'拟确认民族',p.to,60,16);y+=42;

      rowKV(ctx,y,'死者姓名',p.dead,60,16);y+=42;
      rowKV(ctx,y,'性　　别',p.sex,60,16);y+=42;

      rowKV(ctx,y,'死亡日期',p.died,60,16);y+=42;

  if(p.kind==='photo'){

    ctx.beginPath();ctx.ellipse(W/2,230,32,34,0,0,Math.PI*2);ctx.fill();

    ctx.fillText('姓名：'+p.name,W/2,320);

    return;
  }
  paper(ctx,W,H,'#64748B');docHeader(ctx,W,p.title||'材料',p.no||'','#64748B');
}

<script>
/* ============ 预览 / 翻页 / 下载 ============ */
function openPreview(mi){
  if(selIdx<0) return;
  const r=RECORDS[selIdx], m=r.mats[mi];
  if(m.pending){toast('该材料尚未上传');return}
  curMatIdx=mi;curPg=0;
  document.getElementById('mTitle').textContent=m.name;
  document.getElementById('mSub').textContent=`${r.hlw} · ${r.name}`;
  document.getElementById('mask').classList.add('show');
  paintModal();
}
function paintModal(){
  const m=RECORDS[selIdx].mats[curMatIdx];
  let pages=m.pages||[m.pages[0]];
  if(m.type==='sfz'){
    const bk=RECORDS[selIdx].mats.find(x=>x.type==='sfz-back');
    if(bk&&bk.pages) pages=[pages[0],bk.pages[0]];
  }
  window.__curPages=pages;
  const c=document.getElementById('mCanvas');
  const ctx=c.getContext('2d');
  drawPage(ctx,c.width,c.height,pages[curPg]);
  document.getElementById('mInfo').textContent=`材料：${m.name} · ${m.size} · 上传于 ${m.up} · 第 ${curPg+1}/${pages.length} 页`;
  document.getElementById('pgInfo').textContent=pages.length>1?`${curPg+1} / ${pages.length}`:'';
  document.getElementById('pgPrev').disabled=curPg<=0;
  document.getElementById('pgNext').disabled=curPg>=pages.length-1;
}
function pgMove(d){
  const n=window.__curPages?window.__curPages.length:1;
  curPg=Math.min(Math.max(0,curPg+d),n-1);
  paintModal();
}
function closeModal(){document.getElementById('mask').classList.remove('show')}
function downloadCur(){
  const m=RECORDS[selIdx].mats[curMatIdx];
  const c=document.getElementById('mCanvas');
  c.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${RECORDS[selIdx].hlw}_${m.name}_p${curPg+1}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('已下载：'+a.download);
  },'image/png');
}
function dlAll(){
  if(selIdx<0) return;
  const r=RECORDS[selIdx], items=r.mats.filter(m=>!m.pending);
  if(!items.length){toast('该记录暂无已上传材料');return}
  const c=document.createElement('canvas');c.width=720;c.height=520;
  const ctx=c.getContext('2d');
  const jobs=[];
  items.forEach(m=>(m.pages&&m.pages.length?m.pages:[m.pages[0]]).forEach((p,pi)=>jobs.push([m,p,pi])));
  jobs.forEach((j,i)=>{
    setTimeout(()=>{
      const [m,p,pi]=j;
      ctx.clearRect(0,0,720,520);
      drawPage(ctx,720,520,p);
      c.toBlob(blob=>{
        if(!blob) return;
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`${r.hlw}_${m.name}_p${pi+1}.png`;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),5000);
      },'image/png');
    }, i*260);
  });
  toast('开始下载 '+jobs.length+' 张材料，请留意浏览器下载栏');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200);
}
function initDate(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('nowDate').textContent=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const wm=document.getElementById('wmTime');
  if(wm) wm.textContent=document.getElementById('nowDate').textContent;
}
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('mask').classList.contains('show'))closeModal();
  if(e.key==='ArrowLeft')pgMove(-1);
  if(e.key==='ArrowRight')pgMove(1);
});
updateCrumb();renderNav();renderBizSel();renderChips();renderList();initDate();
/* 嵌入智防系统外壳时隐藏自身顶栏，高度交给外壳 */
window.gotoBiz=selBiz;
window.pendingCount=pendingCount;
/* 支持通过 URL hash 指定业务（外壳 file:// 跨源时的传参通道） */
(function(){
  const hb=new URLSearchParams(location.hash.slice(1)).get('biz');
  if(hb&&BIZS.some(b=>b.key===hb)) selBiz(hb);
})();
(function(){
  const embedded=window.parent!==window||/embed=1/.test(location.search);
  if(embedded){
    const tb=document.querySelector('.topbar'); if(tb) tb.style.display='none';
    const sd=document.querySelector('.side'); if(sd) sd.style.display='none';
    const ly=document.querySelector('.layout'); if(ly) ly.style.height='100vh';
  }
})();
</script>
